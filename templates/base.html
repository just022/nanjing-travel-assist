<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}南京出行辅助工具{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="nav">
        <div class="nav-brand">南京出行辅助工具</div>
        <div class="nav-links">
            <a href="{{ url_for('main.index') }}">首页</a>
            <a href="{{ url_for('subway.subway_index') }}">地铁查询</a>
            <a href="{{ url_for('bus.bus_index') }}">公交查询</a>
            <a href="{{ url_for('route.route_index') }}">路线规划</a>
            <a href="{{ url_for('spot.spot_index') }}">南京景点</a>
        </div>
    </nav>

    <!-- 页面内容区，子页面在这里填充 -->
    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
