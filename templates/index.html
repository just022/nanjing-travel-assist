{% extends "base.html" %}

{% block title %}首页 - 南京出行辅助工具{% endblock %}

{% block content %}
<h1>南京出行辅助工具</h1>
<p>查询地铁、公交，规划出行路线，了解南京热门景点。</p>

{% if spots %}
<div class="spot-list">
    {% for spot in spots %}
    <div class="card">
        {% if spot.image %}
        <img class="spot-img" src="{{ url_for('static', filename='images/' ~ spot.image) }}" alt="{{ spot.spot_name }}">
        {% endif %}
        <div class="card-body">
            <h3>{{ spot.spot_name }}</h3>
            <p class="traffic">🚇 {{ spot.recommend_traffic }}</p>
        </div>
    </div>
    {% endfor %}
</div>
{% endif %}
{% endblock %}
