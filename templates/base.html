<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}出行辅助工具{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="nav">
        <div class="nav-brand">出行辅助工具</div>
        <div class="nav-links">
            <a href="{{ url_for('main.index') }}">首页</a>
            <a href="{{ url_for('transit.transit_index') }}">出行查询</a>
            <a href="{{ url_for('route.route_index') }}">路线规划</a>
            <a href="{{ url_for('spot.spot_index') }}">热门景点</a>
            <a href="{{ url_for('makeup.makeup_index') }}">妆容推荐</a>
            {% if session_user %}
            <a href="{{ url_for('favorite.index') }}">我的收藏</a>
            <span class="nav-user">{{ session_user }}</span>
            <a href="{{ url_for('auth.logout') }}">退出</a>
            {% else %}
            <a href="{{ url_for('auth.login') }}">登录</a>
            <a href="{{ url_for('auth.register') }}">注册</a>
            {% endif %}
        </div>
    </nav>

    <!-- 页面内容区，子页面在这里填充 -->
    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
